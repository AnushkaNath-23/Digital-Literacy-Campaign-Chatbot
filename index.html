<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digital Literacy Campaign Chatbot UI</title>
  <link rel="stylesheet" href="style.css">
  <!-- Dialogflow Messenger integration -->
    <script src="https://www.gstatic.com/dialogflow-console/fast/messenger/bootstrap.js?v=1"></script>
    <df-messenger
      intent="WELCOME"
      chat-title="DLCChatbot"
      agent-id="e2ee83e8-15fa-4db4-a608-0c9e2804e62e"
      language-code="en"
    ></df-messenger> 
  
</head>
<body>
  <header class="site-header">
    <div class="container">
      <h1>Digital Literacy Campaign</h1>
    </div>
  </header>

  <main class="container">
    <div class="content">
      <h2>Welcome to the Digital Literacy Campaign</h2>
      <p>Our mission is to promote digital skills and knowledge to empower individuals in the digital age.</p>
      <p>Explore our resources and ask our chatbot if you have any questions!</p>
    </div>
  </main>

  
  <!-- Chat Widget Container -->
  <div id="chatbot-container">
    <!-- Chat Toggle Button -->
    <button id="chat-toggle" class="chat-toggle" aria-label="Toggle chat">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="chat-icon">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
      </svg>
    </button> 

    <!-- Chat Window -->
    <div id="chat-window" class="chat-window hidden">
      <div class="chat-header">
        <h3>Digital Literacy Assistant</h3>
        <button id="chat-close" class="chat-close" aria-label="Close chat">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="close-icon">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
      <div id="chat-messages" class="chat-messages"></div>
      <div id="typing-indicator" class="typing-indicator hidden">
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
      </div>
      <div class="chat-input-container">
        <input type="text" id="chat-input" placeholder="Type your message here..." aria-label="Message">
        <button id="chat-send" class="chat-send" aria-label="Send message">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="send-icon">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </div>
    </div>
  </div> 



  <script src="script.js"></script>
</body>
</html>
